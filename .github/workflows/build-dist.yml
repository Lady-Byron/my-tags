name: build-dist
on:
  push:
    branches: [ master, main, feat/hidden-group ]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - uses: EndBug/add-and-commit@v9
        with:
          add: "js/dist -f"
          message: "chore(ci): build dist [skip ci]"

name: Checks & Production Build

on:
  push:
    branches:
      - master
      - main
      - feat/hidden-group

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      # 关键：使用 yarn，并严格按 yarn.lock 安装，避免拉到不兼容的新依赖（如 TS 5.5）
      - name: Install deps (yarn, locked)
        run: yarn install --frozen-lockfile

      # 自动修复格式，再跑检查（检查失败也不阻塞，可按需去掉 || true）
      - name: Format (fix)
        run: yarn run format-fix || true

      - name: Format (check)
        run: yarn run format-check || true

      # 某些仓库包含 typings 构建；没有也不会失败
      - name: Build typings
        run: yarn run build-typings || true

      - name: Build JS bundle
        run: yarn run build

      # 回推打包产物，Flarum 生产环境需要 js/dist
      - name: Commit dist
        uses: EndBug/add-and-commit@v9
        with:
          add: "js/dist -f"
          message: "chore(ci): build dist [skip ci]"

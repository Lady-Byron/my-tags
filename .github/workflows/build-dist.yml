name: Checks & Production Build

on:
  push:
    branches:
      - master
      - main
      - feat/hidden-group

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # 或 18，看 package.json engines

      # 用 npm 安装；有 package-lock.json 就用 ci，没有就普通 install
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm i
          fi

      # 自动修复格式（不阻塞）
      - name: Format (fix)
        run: npm run format-fix || true

      # 直接构建产物
      - name: Build JS bundle
        run: npm run build

      # 提交 js/dist（Flarum 生产会用这个目录）
      - name: Commit dist
        uses: EndBug/add-and-commit@v9
        with:
          add: "js/dist -f"
          message: "chore(ci): build dist [skip ci]"


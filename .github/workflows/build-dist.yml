name: Checks & Production Build
on:
  push:
    branches: [ master, main, feat/hidden-group ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm i
          fi
      - name: Format (fix)
        run: npm run format-fix || true
      - name: Build JS bundle
        run: npm run build
      - name: Commit dist
        uses: EndBug/add-and-commit@v9
        with:
          add: "js/dist -f"
          message: "chore(ci): build dist [skip ci]"
